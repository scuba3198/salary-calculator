name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Tests (Sequential Fail-Fast)
        run: |
          npm run lint && \
          npm run check && \
          npm run typecheck && \
          npm run test && \
          npm run build
